plugins { id 'com.android.application' }
android {
    namespace 'com.layerrate.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.layerrate.app'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '2.12'
        buildConfigField 'String', 'UPDATE_MANIFEST_URL', '"https://raw.githubusercontent.com/Buddah0024-pixel/LayerRate/main/latest.json"'
    }
    buildFeatures { buildConfig true }
}
