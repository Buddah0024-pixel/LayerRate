name: LayerRate signed release
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          CODE=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1)
          NAME=$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\([^']*\)'.*/\1/p" app/build.gradle | head -1)
          test -n "$CODE" && test -n "$NAME"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - name: Build release APK
        run: gradle assembleRelease --no-daemon
      - name: Sign and verify release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.LAYERRATE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LAYERRATE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.LAYERRATE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LAYERRATE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/layerrate.jks"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/layerrate.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out LayerRate.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose LayerRate.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LayerRate-signed-release
          path: LayerRate.apk
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          TAG="v$VERSION_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" LayerRate.apk --clobber
          else
            gh release create "$TAG" LayerRate.apk --title "LayerRate $VERSION_NAME" --notes "LayerRate signed Android update $VERSION_NAME"
          fi
          curl --fail --location --silent --show-error --output /dev/null --head "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/LayerRate.apk"
      - name: Update in-app update manifest after successful publication
        uses: actions/github-script@v7
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'latest.json';
            const code = Number(process.env.VERSION_CODE);
            const name = process.env.VERSION_NAME;
            const apkUrl = `https://github.com/${owner}/${repo}/releases/download/v${name}/LayerRate.apk`;
            const old = await github.rest.repos.getContent({owner, repo, path, ref: 'main'});
            const oldManifest = JSON.parse(Buffer.from(old.data.content, 'base64').toString('utf8'));
            if (Number(oldManifest.versionCode) > code) {
              throw new Error('Refusing to roll back the published app version');
            }
            const manifest = {versionCode: code, versionName: name, apkUrl, notes: 'LayerRate update ' + name};
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: 'main', sha: old.data.sha,
              message: 'Publish LayerRate ' + name + ' update manifest',
              content: Buffer.from(JSON.stringify(manifest, null, 2) + '\n').toString('base64')
            });
